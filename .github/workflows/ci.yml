name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Verify deployment and rollback scenarios
        shell: pwsh
        run: ./tests/deploy-local.test.ps1
      - run: npm audit --audit-level=high
      - name: Validate GitHub Actions workflows
        run: >-
          docker run --rm --volume "${PWD}:/repo" --workdir /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      - name: Coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: error

  container:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the runtime image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: container-cicd-lab:ci
          build-args: |
            REVISION=${{ github.sha }}
            SOURCE=https://github.com/${{ github.repository }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test the actual container and graceful shutdown
        env:
          EXPECTED_RUNTIME_NODE: '26.10.0'
        run: node scripts/container-test.mjs container-cicd-lab:ci
      - run: mkdir -p reports
      - name: Vulnerability gate
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: container-cicd-lab:ci
          grype-version: v0.120.0
          severity-cutoff: high
          fail-build: true
          only-fixed: false
          output-format: sarif
          output-file: reports/vulnerabilities.sarif
      - name: Generate SBOM for the tested image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: container-cicd-lab:ci
          format: spdx-json
          output-file: reports/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Preserve security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-reports
          path: reports/
          retention-days: 30
          if-no-files-found: warn
      - name: Export tested image for publication
        if: github.event_name != 'pull_request'
        run: |
          docker save container-cicd-lab:ci --output image.tar
          docker image inspect container-cicd-lab:ci --format '{{.Id}}' > image-id.txt
          sha256sum image.tar > image.tar.sha256
      - name: Transfer the exact image
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-image
          path: |
            image.tar
            image.tar.sha256
            image-id.txt
          compression-level: 0
          retention-days: 2

  publish:
    needs: container
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require version tags to reference main history
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          [[ "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-image
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-reports
          path: reports
      - name: Verify artifact integrity
        run: |
          sha256sum --check image.tar.sha256
          docker load --input image.tar
          test "$(docker image inspect container-cicd-lab:ci --format '{{.Id}}')" = "$(cat image-id.txt)"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish without rebuilding
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          tag="sha-$REVISION"
          docker tag container-cicd-lab:ci "$image:$tag"
          docker push "$image:$tag"
          digest=$(docker image inspect "$image:$tag" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          if [ "$REF_TYPE" = tag ]; then
            docker tag container-cicd-lab:ci "$image:$REF_NAME"
            docker push "$image:$REF_NAME"
          fi
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          jq -n --arg image "$image" --arg digest "$digest" --arg revision "$REVISION" \
            '{image:$image,digest:$digest,revision:$revision}' > deployment.json
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$image@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Sign build provenance with GitHub OIDC
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Sign the image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: reports/sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment
          path: deployment.json
          retention-days: 90
