name: Deploy local laptop
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      digest:
        description: 'Digest publicado: sha256:... (también permite volver a una versión anterior)'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: read
  attestations: read

concurrency:
  group: deploy-local-laptop
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    environment: local-laptop
    runs-on: [self-hosted, Windows, X64, container-cicd-lab-local]
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          clean: true
      - name: Download only the manifest from the successful CI run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deployment
          path: manifest
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate the manifest and isolate registry credentials
        id: image
        env:
          INPUT_DIGEST: ${{ inputs.digest }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_REVISION: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $image = 'ghcr.io/' + $env:REPOSITORY.ToLowerInvariant()
          if ($env:EVENT_NAME -eq 'workflow_run') {
            $manifest = Get-Content -LiteralPath manifest/deployment.json -Raw | ConvertFrom-Json
            if ($manifest.image -ne $image -or $manifest.revision -ne $env:EXPECTED_REVISION) { throw 'Manifiesto no confiable' }
            $digest = $manifest.digest
            $revision = $manifest.revision
          } else { $digest = $env:INPUT_DIGEST; $revision = '' }
          if ($digest -cnotmatch '^sha256:[a-f0-9]{64}$') { throw 'Digest inválido' }
          $config = Join-Path $env:RUNNER_TEMP ('docker-auth-' + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $config -Force | Out-Null
          "DOCKER_CONFIG=$config" >> $env:GITHUB_ENV
          "ref=$image@$digest" >> $env:GITHUB_OUTPUT
          "revision=$revision" >> $env:GITHUB_OUTPUT
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify signed provenance before executing the image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          REVISION: ${{ steps.image.outputs.revision }}
        run: |
          $policy = @('--repo', 'jorgefprietol/container-cicd-lab', '--signer-workflow', 'jorgefprietol/container-cicd-lab/.github/workflows/ci.yml', '--deny-self-hosted-runners')
          if ($env:REVISION) { $policy += @('--source-digest', $env:REVISION) }
          & gh attestation verify ('oci://' + $env:IMAGE_REF) @policy
          if ($LASTEXITCODE -ne 0) { throw 'La procedencia de la imagen no es válida' }
      - name: Deploy and roll back on failed health or smoke checks
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          REVISION: ${{ steps.image.outputs.revision }}
        run: |
          ./scripts/deploy-local.ps1 -ImageRef $env:IMAGE_REF -ExpectedRevision $env:REVISION
          "### Local deployment" >> $env:GITHUB_STEP_SUMMARY
          "http://127.0.0.1:8088 · $env:IMAGE_REF" >> $env:GITHUB_STEP_SUMMARY
      - name: Remove only this run's registry credentials
        if: always()
        run: |
          if ($env:DOCKER_CONFIG) {
            $target = [IO.Path]::GetFullPath($env:DOCKER_CONFIG)
            $expected = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP ('docker-auth-' + $env:GITHUB_RUN_ID)))
            if ($target -ne $expected) { throw 'Ruta de limpieza no permitida' }
            Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction SilentlyContinue
          }
