name: container-cicd-lab-dev
services:
  api:
    build:
      context: .
      args:
        REVISION: local
    image: container-cicd-lab:local
    ports:
      - '127.0.0.1:8089:8080'
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 64
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'
